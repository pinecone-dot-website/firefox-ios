# SampleBrowser on Gecko. Generate with `xcodegen generate` in this folder.
# Compiles SampleBrowser's own sources with GECKO_ENGINE set, swaps in App/ for the
# files that assume a UIKit-owned launch, and embeds Gecko's GeckoView framework and
# BrowserEngineKit process extensions, built from the sibling mozilla-firefox checkout.
name: SampleBrowserGecko
options:
  bundleIdPrefix: org.eaglstun.geckoport
  deploymentTarget:
    iOS: "18.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GECKO_TOPSRCDIR: $(SRCROOT)/../../../mozilla-firefox
    GECKO_TOPOBJDIR: $(GECKO_TOPSRCDIR)/obj-ios-sim
    GECKO_IOS_SRC: $(GECKO_TOPSRCDIR)/mobile/ios/GeckoTestBrowser
packages:
  BrowserKit:
    path: ../../BrowserKit
targets:
  SampleBrowserGecko:
    type: application
    platform: iOS
    sources:
      - path: ../../SampleBrowser/SampleBrowser
        excludes:
          - AppDelegate.swift
          - Dependency/DependencyHelper.swift
          - Info.plist
      - path: App
    settings:
      INFOPLIST_FILE: ../../SampleBrowser/SampleBrowser/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: org.eaglstun.geckoport.SampleBrowserGecko
      CODE_SIGN_ENTITLEMENTS: Entitlements/App.entitlements
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) GECKO_ENGINE
    dependencies:
      - package: BrowserKit
        product: WebEngine
      - package: BrowserKit
        product: ToolbarKit
      - package: BrowserKit
        product: SummarizeKit
      - target: GeckoEngine
      - target: GeckoView
      - target: WebContent
      - target: Networking
      - target: Rendering

  GeckoEngine:
    type: library.static
    platform: iOS
    sources:
      - path: ../../BrowserKit/Sources/GeckoEngine
    settings:
      SWIFT_ENABLE_EXPLICIT_MODULES: NO
      OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(GENERATED_MODULEMAP_DIR)/GCDWebServers.modulemap
    dependencies:
      - package: BrowserKit
        product: WebEngine
      - target: GeckoView
        embed: false
        link: false

  GeckoView:
    type: framework
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/GeckoView
        excludes:
          - AddGecko.sh
    preBuildScripts:
      - name: Add Gecko
        script: '"${GECKO_IOS_SRC}/GeckoView/AddGecko.sh"'
        basedOnDependencyAnalysis: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.eaglstun.geckoport.SampleBrowserGecko.GeckoView
      GENERATE_INFOPLIST_FILE: YES
      DEFINES_MODULE: YES
      SKIP_INSTALL: YES
      DYLIB_INSTALL_NAME_BASE: "@rpath"
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @loader_path/Frameworks
      OTHER_LDFLAGS: $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Frameworks/XUL

  WebContent:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/WebContent/WebContent.swift
    settings:
      INFOPLIST_FILE: $(GECKO_IOS_SRC)/WebContent/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: org.eaglstun.geckoport.SampleBrowserGecko.WebContent
      CODE_SIGN_ENTITLEMENTS: Entitlements/WebContent.entitlements
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies:
      - target: GeckoView
        embed: false

  Networking:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/Networking/Networking.swift
    settings:
      INFOPLIST_FILE: $(GECKO_IOS_SRC)/Networking/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: org.eaglstun.geckoport.SampleBrowserGecko.Networking
      CODE_SIGN_ENTITLEMENTS: Entitlements/Networking.entitlements
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies:
      - target: GeckoView
        embed: false

  Rendering:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/Rendering/Rendering.swift
    settings:
      INFOPLIST_FILE: $(GECKO_IOS_SRC)/Rendering/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: org.eaglstun.geckoport.SampleBrowserGecko.Rendering
      CODE_SIGN_ENTITLEMENTS: Entitlements/Rendering.entitlements
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies:
      - target: GeckoView
        embed: false

schemes:
  SampleBrowserGecko:
    build:
      targets:
        SampleBrowserGecko: all
    run:
      config: Debug
