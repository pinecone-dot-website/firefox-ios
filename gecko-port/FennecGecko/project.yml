# Gecko pieces for Fennec. Generate with `xcodegen generate` in this folder; build.sh does
# that and the rest. Builds the GeckoView framework (Gecko's source plus GeckoViewHooks/),
# the GeckoEngine static library Fennec links, and the BrowserEngineKit process extensions
# with Fennec bundle IDs. Fennec itself stays in Client.xcodeproj; see Gecko.xcconfig.
name: FennecGecko
options:
  bundleIdPrefix: org.mozilla.ios.Fennec
  deploymentTarget:
    iOS: "18.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GECKO_TOPSRCDIR: $(SRCROOT)/../../../mozilla-firefox
    GECKO_OBJDIR_iphonesimulator: obj-ios-sim
    GECKO_OBJDIR_iphoneos: obj-ios-device
    GECKO_TOPOBJDIR: $(GECKO_TOPSRCDIR)/$(GECKO_OBJDIR_$(PLATFORM_NAME))
    GECKO_IOS_SRC: $(GECKO_TOPSRCDIR)/mobile/ios/GeckoTestBrowser
packages:
  BrowserKit:
    path: ../../BrowserKit
targets:
  GeckoEngine:
    type: library.static
    platform: iOS
    sources:
      - path: ../../BrowserKit/Sources/GeckoEngine
      - path: Bridge
    settings:
      SWIFT_ENABLE_EXPLICIT_MODULES: NO
      OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(GENERATED_MODULEMAP_DIR)/GCDWebServers.modulemap
    dependencies:
      - package: BrowserKit
        product: WebEngine
      - target: GeckoView
        embed: false
        link: false

  GeckoView:
    type: framework
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/GeckoView
        excludes:
          - AddGecko.sh
      - path: GeckoViewHooks
    preBuildScripts:
      - name: Add Gecko
        script: '"${GECKO_IOS_SRC}/GeckoView/AddGecko.sh"'
        basedOnDependencyAnalysis: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.mozilla.ios.Fennec.GeckoView
      GENERATE_INFOPLIST_FILE: YES
      DEFINES_MODULE: YES
      SKIP_INSTALL: YES
      DYLIB_INSTALL_NAME_BASE: "@rpath"
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @loader_path/Frameworks
      OTHER_LDFLAGS: $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Frameworks/XUL

  WebContent:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/WebContent/WebContent.swift
    settings:
      INFOPLIST_FILE: $(GECKO_IOS_SRC)/WebContent/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: org.mozilla.ios.Fennec.GeckoWebContent
      CODE_SIGN_ENTITLEMENTS: Entitlements/WebContent.entitlements
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies:
      - target: GeckoView
        embed: false

  Networking:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/Networking/Networking.swift
    settings:
      INFOPLIST_FILE: $(GECKO_IOS_SRC)/Networking/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: org.mozilla.ios.Fennec.GeckoNetworking
      CODE_SIGN_ENTITLEMENTS: Entitlements/Networking.entitlements
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies:
      - target: GeckoView
        embed: false

  Rendering:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ../../../mozilla-firefox/mobile/ios/GeckoTestBrowser/Rendering/Rendering.swift
    settings:
      INFOPLIST_FILE: $(GECKO_IOS_SRC)/Rendering/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: org.mozilla.ios.Fennec.GeckoRendering
      CODE_SIGN_ENTITLEMENTS: Entitlements/Rendering.entitlements
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
    dependencies:
      - target: GeckoView
        embed: false

schemes:
  FennecGecko:
    build:
      targets:
        GeckoEngine: all
        GeckoView: all
        WebContent: all
        Networking: all
        Rendering: all
  FennecGeckoDevice:
    build:
      targets:
        GeckoEngine: all
        GeckoView: all
