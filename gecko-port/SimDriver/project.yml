name: SimDriver
options:
  bundleIdPrefix: org.eaglstun.geckoport
  deploymentTarget:
    iOS: "17.0"
targets:
  SimDriverHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        UILaunchScreen: {}
  SimDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SimDriverHost
schemes:
  SimDriver:
    build:
      targets:
        SimDriverHost: all
        SimDriverUITests: [test]
    test:
      targets: [SimDriverUITests]
